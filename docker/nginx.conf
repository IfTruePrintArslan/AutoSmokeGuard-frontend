# AutoSmokeGuard frontend — nginx server block.
#
# Serves the built SPA from /usr/share/nginx/html and reverse-proxies
# /api and /media to the Django backend. Included into nginx:alpine's stock
# http {} context at /etc/nginx/conf.d/default.conf (see frontend/Dockerfile).
#
# One server block serves BOTH plain HTTP on :80 and TLS on :443. `ssl` is a
# per-`listen` parameter in nginx, not a per-server one, so this is a single
# routing table rather than two that have to be kept in sync — which matters
# here, because the media-authorization rules below are security controls and
# a copy-paste drift between an HTTP block and an HTTPS block would silently
# reopen them. See "TLS" below for how 443 stays optional.

# ---------------------------------------------------------------------------
# TLS key material (optional — see scripts/generate-dev-certs.sh)
# ---------------------------------------------------------------------------
# These are `map`ped constants rather than literals on purpose. When
# `ssl_certificate` is given a *variable*, nginx resolves it per handshake
# instead of loading it at configuration-parse time (supported since nginx
# 1.15.9), which is what lets this file declare a :443 listener that nginx
# will happily start without any certificate present.
#
#   * `docker compose up` (no certs, no overlay): nginx boots, binds :443
#     inside the container, and nothing publishes it. The plain-HTTP flow on
#     :8080 is completely unaffected — a student never has to generate a
#     certificate to run the app. This is the default.
#   * `docker compose -f docker-compose.yml -f docker-compose.tls.yml up`:
#     the overlay mounts ./certs at /etc/nginx/certs and publishes 443.
#
# Trade-off, stated honestly: resolving the path per handshake means nginx
# does not cache the parsed certificate, so each new TLS session re-reads and
# re-parses the PEM. At this project's scale that is irrelevant; a large
# deployment terminating TLS here would swap these variables for literal
# paths (and accept that nginx then refuses to start without them).
map $host $asg_tls_certificate     { default /etc/nginx/certs/asg.crt; }
map $host $asg_tls_certificate_key { default /etc/nginx/certs/asg.key; }

# HSTS is emitted on HTTPS responses only. RFC 6797 §7.2 requires that the
# header is *not* sent over a non-secure transport, and sending it from the
# plain-HTTP dev setup would be actively harmful: a browser that saw it once
# on localhost would refuse to load http://localhost:8080 afterwards, for a
# year, for every project on that port. An empty `add_header` value is
# skipped by nginx, so this single variable covers both cases.
#
# /api/ is excluded because Django's own SecurityMiddleware already emits
# HSTS there (SECURE_HSTS_SECONDS in config/settings.py), and now genuinely
# does so over TLS because the proxy forwards X-Forwarded-Proto: https.
# Without this exclusion every API response carries the header twice —
# harmless (RFC 6797 §8.1: a UA processes only the first) but confusing, and
# the two would drift the moment one side's max-age changed. Django's is the
# stricter of the two (it includes `preload`), so nginx yields.
# nginx evaluates a map's regex entries in declaration order.
map "$scheme:$uri" $asg_hsts {
    default          "";
    "~^https:/api/"  "";
    "~^https:"       "max-age=31536000; includeSubDomains";
}

# Whether a request should be bounced to HTTPS. This only ever evaluates to
# "1"; whether the redirect actually *happens* depends on the snippet include
# in the server block below, which is empty unless TLS is switched on.
# ACME's http-01 challenge is exempted because certbot's webroot plugin must
# be reachable over plain HTTP to renew a certificate (see DEPLOYMENT.md §7).
# nginx evaluates a map's regex entries in declaration order.
map "$scheme:$uri" $asg_https_redirect {
    default                                 0;
    "~^https:"                              0;
    "~^http:/\.well-known/acme-challenge/"  0;
    "~^http:"                               1;
}

server {
    listen 80;

    # --- optional TLS ------------------------------------------------------
    # Certificates are resolved through the variables above, so this listener
    # costs nothing when no certificate exists. Only the TLS compose overlay
    # publishes the port.
    listen 443 ssl;
    http2 on;

    ssl_certificate     $asg_tls_certificate;
    ssl_certificate_key $asg_tls_certificate_key;

    # Mozilla "intermediate" (2024-2025): TLS 1.2 + 1.3 only, AEAD suites
    # only, forward secrecy on every suite. TLS 1.0/1.1 and every CBC and
    # RSA-key-exchange suite are excluded.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    # Let the client pick: with TLS 1.3 and an AEAD-only 1.2 list there is no
    # weak option left to protect it from, and the client knows best whether
    # it has AES hardware (AES-GCM) or not (ChaCha20).
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:ASG_TLS:10m;
    ssl_session_timeout 1d;
    # Tickets without key rotation break forward secrecy; nginx has no
    # rotation of its own, so resumption goes through the session cache.
    ssl_session_tickets off;

    # HTTP -> HTTPS redirect: OFF by default.
    #
    # A wildcard include matching zero files is not an error in nginx, and
    # this directory does not exist in the image — so out of the box nothing
    # is redirected and `http://localhost:8080` works. The TLS overlay mounts
    # a directory here containing a single `if ($asg_https_redirect) { return
    # 301 https://$host$request_uri; }`, selected by the ASG_HTTPS_REDIRECT
    # environment variable (off|on). See docker-compose.tls.yml.
    #
    # It is deliberately not unconditional: a redirect to a port nothing
    # listens on is the single most common way to make a local Docker stack
    # look broken, and this project is run by people who did not set it up.
    include /etc/nginx/asg-https-redirect.d/*.conf;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads (traffic video/images) can be large. ASG_MAX_UPLOAD_MB defaults
    # to 512 (see backend .env.example) — nginx's own default
    # client_max_body_size is 1m, which would reject anything bigger with a
    # bare 413 before the request ever reaches Django's own size validation.
    # Match the backend's default ceiling here so nginx isn't the tighter
    # limit.
    client_max_body_size 512m;

    # Sent on HTTPS responses only (see the $asg_hsts map). Repeated in every
    # location that declares an `add_header` of its own, because nginx's
    # add_header directives are inherited only while the child level defines
    # *none* — a single `add_header` in a location silently drops every
    # server-level header. Each repetition below is flagged with this reason.
    add_header Strict-Transport-Security $asg_hsts always;

    # --- gzip: compress the text-ish assets that benefit from it ----------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # --- API + media reverse proxy -----------------------------------------
    # "backend" is the docker-compose service name / Docker DNS hostname;
    # gunicorn listens on :8000 inside that container (see backend/Dockerfile
    # + backend/docker/entrypoint.sh).
    # `^~` forces this to win against the file-extension regex location
    # below once it's the longest matching prefix — without it, a request
    # like /api/media.json (or, more importantly, any /media/*.jpg path;
    # see that location further down) would instead be matched by the regex
    # location, since nginx checks regex locations before plain-prefix ones.
    location ^~ /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # $scheme, not a hard-coded "http": Django reads this through
        # SECURE_PROXY_SSL_HEADER to decide whether the original request was
        # secure. Over :443 it now genuinely says "https", which is what
        # makes request.is_secure() correct and stops SECURE_SSL_REDIRECT
        # from looping.
        proxy_set_header X-Forwarded-Proto $scheme;
        # Analysis requests can legitimately run for minutes (no Celery/
        # Redis — the ML worker runs in-process; see entrypoint.sh). Don't
        # let nginx time the proxied connection out before gunicorn replies.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # -----------------------------------------------------------------------
    # Generated PDF reports — blocked outright (security review ASG-04).
    # -----------------------------------------------------------------------
    # `common.middleware.MediaGuardMiddleware` already blocks this subtree,
    # but it only runs when *Django* serves the file. In the container nginx
    # serves /media/ straight off the shared volume (see the next location)
    # and never proxies it, so the middleware was not in the request path at
    # all and every generated report was readable by an anonymous client in
    # the containerised — i.e. the production-shaped — deployment. This block
    # is the other half of that fix.
    #
    # A report is the most sensitive artefact the system produces and nothing
    # needs it as a static file: the SPA and the API contract both use the
    # authenticated `GET /api/download-report/{report_id}`, which scopes to
    # the owner. Closing this route costs no functionality.
    #
    # 404 rather than 403, matching the middleware: a 403 would confirm that
    # a given report id exists, which is itself a leak.
    #
    # Placement: nginx picks the LONGEST matching prefix location, and `^~`
    # on that winner stops it from also considering regex locations. This
    # prefix is longer than `^~ /media/`, so it wins — and it must keep the
    # `^~`, or the `\.(jpg|png|...)$` regex location further down would be
    # consulted first for a report named *.pdf... today .pdf is not in that
    # regex, but adding it later would silently un-block this tree. That
    # exact class of bug (a regex location shadowing /api/ and /media/) is
    # already recorded in DEPLOYMENT.md §9.
    location ^~ /media/reports/ {
        # `deny all` is defence in depth only. nginx runs `return` in the
        # rewrite phase, which is *before* the access phase that `deny`
        # belongs to, so the 404 below is what a client actually sees; the
        # deny is what still refuses the request if the return is ever
        # removed.
        deny all;
        return 404;
        # Left in the access log on purpose. A request for a report URL is
        # either a stale bookmark or someone probing, and both are worth
        # seeing; the Django-side guard logs its equivalent to `asg.media`
        # (review §12).
    }

    # Media (uploads, annotated previews/crops/masks) is served directly from
    # the shared `backend-media` volume rather than proxied to Django.
    # backend/config/urls.py only wires up Django's own MEDIA_URL route when
    # DEBUG=True ("In production this is the web server's / object store's
    # job" — see that file's comment); with DEBUG=False, as the production
    # compose file runs, nothing on the Django side serves /media/ at all, so
    # this location is what actually fulfills that job.
    #
    # These remain capability URLs (possession of the UUID path is the
    # credential) and that is a documented, accepted residual risk — see
    # docs/SECURITY_REVIEW.md §4.4. They are referenced by `<img src=...>` in
    # the SPA and a browser cannot attach a Bearer header to an image
    # request, so gating them needs signed expiring URLs or an
    # X-Accel-Redirect handler, which is a design change rather than a
    # configuration one. The reports subtree above has no such constraint,
    # which is why it is closed and these are not.
    #
    # `^~`: most media filenames end in .jpg/.png/etc, which would otherwise
    # be caught by the file-extension regex location below instead of this
    # one — nginx checks regex locations ahead of plain-prefix locations, so
    # without `^~` every uploaded image would 404 (regex location's root is
    # the SPA's html directory, which obviously has no /media subtree).
    location ^~ /media/ {
        # Case-insensitive backstop for the reports block above. Prefix
        # locations are case-sensitive, so `/media/REPORTS/x.pdf` skips it
        # and lands here; on a case-sensitive Linux volume that then 404s
        # anyway, but a developer bind-mounting media from macOS or Windows
        # gets a case-INsensitive filesystem and the file is served. Verified
        # against a real container: without this line `/media/REPORTS/…`
        # returned 200. `$uri` is nginx's decoded, `..`-resolved path, so
        # `%52EPORTS` and `%2e%2e` tricks are normalised before this runs.
        # (`if` with `return` is one of the two uses documented as safe.)
        if ($uri ~* ^/media/reports/) {
            return 404;
        }

        alias /media/;
        add_header X-Content-Type-Options nosniff;
        # Repeated: this location declares an add_header, which suppresses
        # inheritance of the server-level one.
        add_header Strict-Transport-Security $asg_hsts always;
    }

    # --- static asset caching -----------------------------------------------
    # Vite fingerprints built JS/CSS/asset filenames (e.g. app.<hash>.js), so
    # they are safe to cache "forever" — a new deploy ships new filenames, a
    # client is never stuck holding a stale one under the same URL.
    # (This intentionally does not need `^~`: all three locations it could
    # otherwise collide with, /api/, /media/reports/ and /media/, are already
    # `^~` prefixes of higher priority than any regex location, per nginx's
    # matching order, so this block only ever sees requests outside those
    # trees.)
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repeated: see the note on the server-level add_header.
        add_header Strict-Transport-Security $asg_hsts always;
        try_files $uri =404;
    }

    # index.html is NOT fingerprinted — it's what references the fingerprinted
    # asset names — so it must always be revalidated, or a returning client
    # would keep loading a stale bundle reference forever after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
        # Repeated: see the note on the server-level add_header.
        add_header Strict-Transport-Security $asg_hsts always;
        try_files $uri =404;
    }

    # --- SPA history fallback -----------------------------------------------
    # React Router routes (e.g. /history, /analysis/<id>) are client-side
    # only; any path nginx can't match to a real file falls back to
    # index.html so the SPA's own router can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
