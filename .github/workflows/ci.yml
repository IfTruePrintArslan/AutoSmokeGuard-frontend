name: Frontend CI

# frontend/ is its own git repository, so this workflow's checkout root IS
# the repo root (package.json, vite.config.js, Dockerfile all live at ".").
on:
  # No branch filter: this project develops on feature branches
  # (feat/auth-form-validation, etc.), not just main/dev/staging, and a
  # push-triggered workflow that only listens on those three branches simply
  # never runs during normal development. Every push, on every branch, runs
  # CI; the branch list below still gives main/dev/staging their PR gate.
  push:
  pull_request:
    branches: [main, dev, staging]

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # --- cross-repo input for the backend-parity drift guards ----------
      #
      # Three tests read the Django source and assert this client's mirrors of
      # it have not drifted:
      #   src/lib/__tests__/reportBudget.test.js -> reports/services.py
      #                                             (REPORT_BUDGET_SECONDS)
      #   src/lib/__tests__/reportStatus.test.js -> analysis/models.py
      #                                             (REPORT_STATUS_CHOICES)
      # frontend/ is its own git repo, so a standalone checkout has no sibling
      # backend/ — which is why those three failed here with ENOENT while
      # passing on a machine where frontend/ happens to sit inside FYP/. They
      # now search for the backend (ASG_BACKEND_PATH first) and skip with an
      # explicit "MISSING INPUT" message when it is absent; this step is what
      # stops that skip from being the permanent state.
      #
      # Placed *after* Lint deliberately: `npm run lint` is `eslint .`, and
      # eslint.config.js only ignores dist/node_modules/playwright-report/
      # test-results — a _backend/ directory sitting in the workspace during
      # that step would be linted too. (The backend repo has no JS files
      # today, so this is defence against a future one rather than a live
      # problem, but the ordering costs nothing.)
      #
      # ---------------------------------------------------------------------
      # ACTION REQUIRED BY THE REPO OWNER FOR THESE GUARDS TO ACTUALLY RUN
      # ---------------------------------------------------------------------
      # The backend repo is PRIVATE, and the automatic `secrets.GITHUB_TOKEN`
      # is scoped to *this* repository only — it cannot read another private
      # repo, whatever permissions are granted here. So with nothing
      # configured the checkout below fails, `continue-on-error: true` keeps
      # the build green, and the three parity guards degrade to their explicit
      # skips. That is the honest status quo: they are inert until someone
      # adds the credential.
      #
      # To make them run for real, add a repository (or organisation) secret
      # named SIBLING_REPO_TOKEN containing a token that can read
      # IfTruePrintArslan/AutoSmokeGuard-backend:
      #   * a fine-grained PAT with `Contents: read` on that repo, or
      #   * a classic PAT with the `repo` scope, or
      #   * a GitHub App installation token with contents:read on both repos.
      # Nothing else needs to change: the expression below already prefers
      # SIBLING_REPO_TOKEN and falls back to GITHUB_TOKEN when it is absent,
      # and the step after it reports which way it went.
      - name: Check out the backend repo (supplies the parity sources)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: IfTruePrintArslan/AutoSmokeGuard-backend
          path: _backend
          token: ${{ secrets.SIBLING_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          # This checkout exists only to be read by three tests; leaving its
          # credentials in _backend/.git/config would serve no purpose.
          persist-credentials: false

      - name: Report whether the parity drift guards have their input
        # Makes the degradation visible in the log instead of silent: a skip
        # that nobody notices is indistinguishable from a passing guard.
        shell: bash
        run: |
          if [ -f "_backend/reports/services.py" ] && [ -f "_backend/analysis/models.py" ]; then
            echo "backend sources found -> the parity drift guards will RUN."
          else
            # One physical line on purpose: a ::warning:: workflow command is
            # terminated by the first newline.
            echo "::warning title=Parity drift guards inactive::The backend sources were not checked out, so the REPORT_BUDGET_SECONDS and REPORT_STATUS_CHOICES parity guards will SKIP instead of comparing this client against the server. The backend repo is private; add a SIBLING_REPO_TOKEN secret that can read it (see the comment above this step in .github/workflows/ci.yml)."
          fi

      - name: Test
        env:
          # Points the guards at the sibling checkout above. When that
          # checkout did not happen the directory simply does not exist, the
          # tests' own candidate search comes up empty, and they skip loudly.
          ASG_BACKEND_PATH: ${{ github.workspace }}/_backend
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload dist/ artifact
        # Ubuntu leg only: the dist/ output is identical across OSes (Vite
        # builds are not platform-specific), so uploading it twice would
        # just be redundant. It also sidesteps the artifact-name collision
        # that would otherwise happen when two matrix legs both try to
        # upload a "frontend-dist" artifact — upload-artifact@v4 requires
        # unique names per run.
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error
